<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cổng Dịch vụ công Quốc gia - Chuyển hướng</title>
  <script>
    (function() {
      var pathname = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // Trường hợp URL thiếu /p/home/ (ví dụ /dvc-demo/dvc-chi-tiet-... hoặc /dvc-chi-tiet-...)
      if (pathname.indexOf('/p/home/') === -1 && (pathname.indexOf('dvc-') !== -1 || pathname.indexOf('@') !== -1)) {
        var lastSlash = pathname.lastIndexOf('/');
        var base = pathname.substring(0, lastSlash + 1);
        var filename = pathname.substring(lastSlash + 1);
        var target = base + 'p/home/' + filename + search + hash;
        window.location.replace(target);
        return;
      }

      // Mặc định chuyển hướng về trang chủ
      var basePath = pathname.substring(0, pathname.lastIndexOf('/') + 1);
      window.location.replace(basePath || './');
    })();
  </script>
</head>
<body>
  <div style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">
    <h2>Đang chuyển hướng đến trang dịch vụ công...</h2>
    <p>Nếu trang không tự chuyển hướng sau vài giây, vui lòng <a id="homeLink" href="./">bấm vào đây</a>.</p>
  </div>
</body>
</html>
